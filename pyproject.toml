[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinai-dr"
version = "0.2.0"
description = "Research prototype for diabetic retinopathy severity classification from retinal fundus images using deep learning."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Yash" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=12.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "openpyxl>=3.1",
  "Pillow>=9.4",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "python-multipart>=0.0.6",
  "httpx>=0.24",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]
app = ["streamlit>=1.31"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "E402"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
